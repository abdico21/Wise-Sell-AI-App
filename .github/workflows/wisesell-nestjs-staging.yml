name: WiseSell NestJS staging build

on:
  push:
    branches:
      - staging/supabase-nestjs-ai
    paths:
      - "backend/**"
      - ".github/workflows/wisesell-nestjs-staging.yml"
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
