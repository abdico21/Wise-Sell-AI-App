name: WiseSell NestJS staging backend
on:
  push:
    branches:
      - staging/nestjs-backend
    paths:
      - 'backend/**'
      - '.github/workflows/backend-staging.yml'
  pull_request:
    branches:
      - staging/nestjs-backend
    paths:
      - 'backend/**'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package.json
      - run: npm install
      - run: npx prisma generate
      - run: npm run build
